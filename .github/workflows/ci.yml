name: GMAIS CI

# Run the test suite and the factorial ablation on every push and PR,
# and publish the observation matrix + report as downloadable artifacts.
on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
  workflow_dispatch:   # lets you trigger a run manually from the Actions tab

jobs:
  ablation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Run 2x2 factorial ablation (540 observations)
        run: |
          python -m gmais.cli run --per-tier 45 | tee ablation_report.txt
          python -m gmais.cli export --per-tier 45 --out gmais_observations.csv

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: gmais-ablation-results
          path: |
            ablation_report.txt
            gmais_observations.csv
